[package]
name = "corp-finance-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for corp-finance-core (cfa-core plugin)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# v0.2 ships the full corp-finance-core surface (244 tools).
# The web-time + getrandom-js shims (below) make the timing- and RNG-using
# modules (Monte Carlo, scenarios) work on wasm32-unknown-unknown.
corp-finance-core = { path = "../corp-finance-core", default-features = false, features = [
    "full",
] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# rand on wasm32 needs the getrandom JS shim to source entropy from the host
# (Node `crypto.getRandomValues`, browser `crypto.getRandomValues`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
