lease_accounting = ["corp-finance-core/lease_accounting"]
pension = ["corp-finance-core/pension"]
sovereign = ["corp-finance-core/sovereign"]
real_options = ["corp-finance-core/real_options"]
equity_research = ["corp-finance-core/equity_research"]
commodity_trading = ["corp-finance-core/commodity_trading"]
quant_strategies = ["corp-finance-core/quant_strategies"]
treasury = ["corp-finance-core/treasury"]
infrastructure = ["corp-finance-core/infrastructure"]
behavioral = ["corp-finance-core/behavioral"]
performance_attribution = ["corp-finance-core/performance_attribution"]
credit_portfolio = ["corp-finance-core/credit_portfolio"]
macro_economics = ["corp-finance-core/macro_economics"]
compliance = ["corp-finance-core/compliance"]
