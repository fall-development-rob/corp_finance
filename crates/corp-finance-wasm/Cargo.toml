[package]
name = "corp-finance-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for corp-finance-core (cfa-core plugin)"

[lib]
crate-type = ["cdylib"]

[features]
# Wave 16a pilot: fpa module (variance_analysis, breakeven_analysis,
# working_capital, rolling_forecast). Pure-math; compiles cleanly to
# wasm32-unknown-unknown via the compat::Instant shim.
fpa = []
# Wave 16x bulk port: 6 small pure-math modules (15 tools).
behavioral = []
performance_attribution = []
quant_strategies = []
equity_research = []
commodity_trading = []
dividend_policy = []
# Wave 16y bulk port: 12 medium pure-math modules (71 tools).
offshore_structures = []
jurisdiction = []
institutional_real_estate = []
earnings_quality = []
financial_forensics = []
bank_analytics = []
emerging_markets = []
carbon_markets = []
clo_analytics = []
# Wave 16z bulk port: 12 modules (53 tools).
fund_of_funds = []
private_wealth = []
venture = []
credit_scoring = []
capital_allocation = []
index_construction = []
regulatory = []
quant_risk = []
esg = []
insurance = []
fx_commodities = []
private_credit = []

[dependencies]
# v0.1 ships the timing-free feature subset — see docs in lib.rs for the v0.2 expansion plan.
# v0.2 adds the fpa feature (Wave 16a pilot port).
# v0.3 adds 6 modules in Wave 16x bulk port.
# v0.4 adds 12 modules in Wave 16y bulk port (offshore/jurisdiction/IRE/forensics/clo/etc.).
corp-finance-core = { path = "../corp-finance-core", default-features = false, features = [
    "valuation",
    "credit",
    "pe",
    "ma",
    "portfolio",
    "fixed_income",
    "derivatives",
    "three_statement",
    "fpa",
    "behavioral",
    "performance_attribution",
    "quant_strategies",
    "equity_research",
    "commodity_trading",
    "dividend_policy",
    "offshore_structures",
    "jurisdiction",
    "institutional_real_estate",
    "earnings_quality",
    "financial_forensics",
    "bank_analytics",
    "emerging_markets",
    "carbon_markets",
    "clo_analytics",
    "fund_of_funds",
    "private_wealth",
    "venture",
    "credit_scoring",
    "capital_allocation",
    "index_construction",
    "regulatory",
    "quant_risk",
    "esg",
    "insurance",
    "fx_commodities",
    "private_credit",
] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
