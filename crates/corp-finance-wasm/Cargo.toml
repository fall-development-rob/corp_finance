[package]
name = "corp-finance-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for corp-finance-core (cfa-core plugin)"

[lib]
crate-type = ["cdylib"]

# ---------------------------------------------------------------------------
# Per-domain feature gates
#
# Each `wasm_tool!` invocation in src/lib.rs is wrapped in
# `#[cfg(feature = "<domain>")]`. Enabling a feature on this crate
# transitively enables the same feature on `corp-finance-core`, so the
# auto-generated WASM exports and the underlying compute paths are
# compiled together. Disabling a feature drops both — yielding a smaller
# `.wasm` artifact.
#
# Defaults: `full` keeps the v0.2 244-tool surface intact (no behavioural
# change). End users wanting a slim build can use:
#
#     cargo build -p corp-finance-wasm --no-default-features \
#         --features="valuation,credit"        # the `slim` preset
#     cargo build -p corp-finance-wasm --no-default-features \
#         --features="fixed_income,derivatives,credit"  # custom mix
#
# See plugins/cfa-core/README.md for a measured size table.
# ---------------------------------------------------------------------------
[features]
default = ["full"]

# Convenience preset: smallest "useful" WASM (valuation + credit).
slim = ["valuation", "credit"]

# Mirror corp-finance-core's `full`: every domain wired through.
full = [
    "valuation", "credit", "pe", "ma", "portfolio", "fixed_income",
    "three_statement", "jurisdiction", "scenarios", "monte_carlo",
    "derivatives", "quant_risk", "restructuring", "real_assets",
    "fx_commodities", "securitization", "venture", "esg", "regulatory",
    "insurance", "private_credit", "fpa", "wealth", "crypto", "trade_finance",
    "structured_products", "municipal", "credit_derivatives", "convertibles",
    "lease_accounting", "pension", "sovereign", "real_options",
    "equity_research", "commodity_trading", "quant_strategies", "treasury",
    "infrastructure", "behavioral", "performance_attribution",
    "credit_portfolio", "macro_economics", "compliance", "onshore_structures",
    "offshore_structures", "transfer_pricing", "tax_treaty", "fatca_crs",
    "substance_requirements", "regulatory_reporting", "aml_compliance",
    "volatility_surface", "portfolio_optimization", "risk_budgeting",
    "market_microstructure", "interest_rate_models", "mortgage_analytics",
    "inflation_linked", "repo_financing", "capital_allocation",
    "credit_scoring", "clo_analytics", "fund_of_funds", "earnings_quality",
    "dividend_policy", "carbon_markets", "bank_analytics", "private_wealth",
    "emerging_markets", "index_construction", "financial_forensics",
    "workflows", "institutional_real_estate",
]

# Per-domain features. Each one transitively enables the matching feature
# on corp-finance-core (so the underlying compute is compiled in too).
valuation = ["corp-finance-core/valuation"]
credit = ["corp-finance-core/credit"]
pe = ["corp-finance-core/pe"]
ma = ["corp-finance-core/ma"]
portfolio = ["corp-finance-core/portfolio"]
fixed_income = ["corp-finance-core/fixed_income"]
three_statement = ["corp-finance-core/three_statement"]
jurisdiction = ["corp-finance-core/jurisdiction"]
derivatives = ["corp-finance-core/derivatives"]
quant_risk = ["corp-finance-core/quant_risk"]
restructuring = ["corp-finance-core/restructuring"]
real_assets = ["corp-finance-core/real_assets"]
fx_commodities = ["corp-finance-core/fx_commodities"]
securitization = ["corp-finance-core/securitization"]
venture = ["corp-finance-core/venture"]
esg = ["corp-finance-core/esg"]
regulatory = ["corp-finance-core/regulatory"]
insurance = ["corp-finance-core/insurance"]
private_credit = ["corp-finance-core/private_credit"]
