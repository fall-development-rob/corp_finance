[package]
name = "corp-finance-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for corp-finance-core (cfa-core plugin)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# v0.1 ships the timing-free feature subset — see docs in lib.rs for the v0.2 expansion plan.
corp-finance-core = { path = "../corp-finance-core", default-features = false, features = [
    "valuation",
    "credit",
    "pe",
    "portfolio",
    "fixed_income",
    "derivatives",
    "three_statement",
] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
