[package]
name = "corp-finance-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for corp-finance-core (cfa-core plugin)"

[lib]
crate-type = ["cdylib"]

[features]
# Wave 16a pilot: fpa module (variance_analysis, breakeven_analysis,
# working_capital, rolling_forecast). Pure-math; compiles cleanly to
# wasm32-unknown-unknown via the compat::Instant shim.
fpa = []
# Wave 16x bulk port: 6 small pure-math modules (15 tools).
behavioral = []
performance_attribution = []
quant_strategies = []
equity_research = []
commodity_trading = []
dividend_policy = []
# Wave 16y bulk port: 12 medium pure-math modules (71 tools).
offshore_structures = []
jurisdiction = []
institutional_real_estate = []
earnings_quality = []
financial_forensics = []
bank_analytics = []
emerging_markets = []
carbon_markets = []
clo_analytics = []
# Wave 16z bulk port: 12 modules (53 tools).
fund_of_funds = []
private_wealth = []
venture = []
credit_scoring = []
capital_allocation = []
index_construction = []
regulatory = []
quant_risk = []
esg = []
insurance = []
fx_commodities = []
private_credit = []
# Wave 16α bulk port: 35 modules (73 tools).
wealth = []
portfolio_optimization = []
macro_economics = []
scenarios = []
volatility_surface = []
interest_rate_models = []
mortgage_analytics = []
inflation_linked = []
repo_financing = []
risk_budgeting = []
convertibles = []
credit_derivatives = []
credit_portfolio = []
pension = []
real_options = []
structured_products = []
lease_accounting = []
trade_finance = []
crypto = []
transfer_pricing = []
tax_treaty = []
fatca_crs = []
substance_requirements = []
compliance = []
aml_compliance = []
regulatory_reporting = []
securitization = []
treasury = []
infrastructure = []
sovereign = []
restructuring = []
municipal = []
market_microstructure = []
real_assets = []
onshore_structures = []

[dependencies]
# v0.1 ships the timing-free feature subset — see docs in lib.rs for the v0.2 expansion plan.
# v0.2 adds the fpa feature (Wave 16a pilot port).
# v0.3 adds 6 modules in Wave 16x bulk port.
# v0.4 adds 12 modules in Wave 16y bulk port (offshore/jurisdiction/IRE/forensics/clo/etc.).
corp-finance-core = { path = "../corp-finance-core", default-features = false, features = [
    "valuation",
    "credit",
    "pe",
    "ma",
    "portfolio",
    "fixed_income",
    "derivatives",
    "three_statement",
    "fpa",
    "behavioral",
    "performance_attribution",
    "quant_strategies",
    "equity_research",
    "commodity_trading",
    "dividend_policy",
    "offshore_structures",
    "jurisdiction",
    "institutional_real_estate",
    "earnings_quality",
    "financial_forensics",
    "bank_analytics",
    "emerging_markets",
    "carbon_markets",
    "clo_analytics",
    "fund_of_funds",
    "private_wealth",
    "venture",
    "credit_scoring",
    "capital_allocation",
    "index_construction",
    "regulatory",
    "quant_risk",
    "esg",
    "insurance",
    "fx_commodities",
    "private_credit",
    "wealth",
    "portfolio_optimization",
    "macro_economics",
    "scenarios",
    "volatility_surface",
    "interest_rate_models",
    "mortgage_analytics",
    "inflation_linked",
    "repo_financing",
    "risk_budgeting",
    "convertibles",
    "credit_derivatives",
    "credit_portfolio",
    "pension",
    "real_options",
    "structured_products",
    "lease_accounting",
    "trade_finance",
    "crypto",
    "transfer_pricing",
    "tax_treaty",
    "fatca_crs",
    "substance_requirements",
    "compliance",
    "aml_compliance",
    "regulatory_reporting",
    "securitization",
    "treasury",
    "infrastructure",
    "sovereign",
    "restructuring",
    "municipal",
    "market_microstructure",
    "real_assets",
    "onshore_structures",
] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# Wave 16α — getrandom needs the `js` feature on wasm32 because scenarios → rand → getrandom.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
