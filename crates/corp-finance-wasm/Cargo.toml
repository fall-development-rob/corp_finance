[dependencies]
# corp-finance-core is pulled in with `default-features = false` so that
# every domain is opt-in via the per-domain features above. The default
# `full` preset keeps the v0.2 244-tool surface intact.
corp-finance-core = { path = "../corp-finance-core", default-features = false }
wasm-bindgen = "0.2"
# js_sys provides js_sys::Function for the streaming callback bridge — see
# crates/corp-finance-wasm/src/streaming.rs.
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# rand on wasm32 needs the getrandom JS shim to source entropy from the host
# (Node `crypto.getRandomValues`, browser `crypto.getRandomValues`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
