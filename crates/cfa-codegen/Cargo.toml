[package]
name = "cfa-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Code generation tool for cfa-core: NAPI/WASM bindings, MCP tool registry, zod schemas, examples, schema diffs, skill linting"

[[bin]]
name = "cfa-codegen"
path = "src/main.rs"

[lib]
name = "cfa_codegen"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
anyhow = "1"
walkdir = "2"
