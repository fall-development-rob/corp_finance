name: wasm-bundle-size

# Phase 29 Wave 17a — gate the cfa-core plugin's WASM bundle below ADR-027's 5MB threshold.
# Builds the WASM via wasm-pack and fails CI if corp_finance_wasm_bg.wasm exceeds the limit.
# This prevents the per-wave size growth from silently pushing the plugin past the gate.

on:
  push:
    branches: [main]
  pull_request:

env:
  # ADR-027 hard ceiling: above this, evaluate splitting into per-domain .wasm files.
  WASM_SIZE_LIMIT_BYTES: 5242880  # 5 MiB
  # Wave 17a soft target: keep optimised builds under this; warn if exceeded.
  WASM_SIZE_SOFT_TARGET_BYTES: 4194304  # 4 MiB

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-bundle-${{ hashFiles('**/Cargo.lock', 'crates/corp-finance-wasm/Cargo.toml') }}

      - name: Build WASM bundle
        run: bash plugins/cfa-core/scripts/build-wasm.sh

      - name: Check bundle size
        run: |
          set -euo pipefail
          BUNDLE=plugins/cfa-core/mcp/wasm/corp_finance_wasm_bg.wasm
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::WASM bundle missing at $BUNDLE"
            exit 1
          fi
          SIZE=$(stat -c%s "$BUNDLE")
          SIZE_KIB=$(( SIZE / 1024 ))
          SIZE_MIB=$(( SIZE / 1024 / 1024 ))
          echo "WASM bundle: ${SIZE} bytes (${SIZE_KIB} KiB, ~${SIZE_MIB} MiB)"
          echo "Limit: ${WASM_SIZE_LIMIT_BYTES} bytes (5 MiB hard ceiling per ADR-027)"
          echo "Soft target: ${WASM_SIZE_SOFT_TARGET_BYTES} bytes (4 MiB)"
          if [ "$SIZE" -gt "$WASM_SIZE_LIMIT_BYTES" ]; then
            echo "::error::Bundle exceeds 5 MiB hard limit. Either reduce ports or split the bundle (see ADR-027)."
            exit 1
          fi
          if [ "$SIZE" -gt "$WASM_SIZE_SOFT_TARGET_BYTES" ]; then
            echo "::warning::Bundle exceeds 4 MiB soft target — review wave deltas before next port wave."
          fi
          echo "::notice::Bundle within limits."

      - name: Boot plugin server
        run: |
          set -euo pipefail
          cd plugins/cfa-core/mcp
          npm install --no-save
          npm run build
          # Smoke test: boot for ~1s, then kill. Asserts the wasm loads without
          # initialisation panics (e.g. getrandom-without-js missteps).
          (node dist/server.js < /dev/null 2>&1 &)
          sleep 1
          pkill -f "plugins/cfa-core/mcp/dist/server.js" || true
          echo "::notice::Plugin server boots successfully."
