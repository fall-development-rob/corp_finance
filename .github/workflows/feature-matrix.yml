name: Feature Matrix

# Per-feature isolation CI — catches bugs where integration tests under
# crates/corp-finance-core/tests/ assume features that are NOT enabled.
# Reproduces the class of failure: `cargo test -p corp-finance-core
# --features office` (without --lib) tried to compile pe_tests.rs which
# assumed the `pe` feature, and failed.
#
# Fix: always pass --lib to scope tests to the library crate only; each job
# tests exactly one feature in isolation.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ---------------------------------------------------------------------------
  # Per-feature isolation matrix
  # Each entry: build + --lib test for exactly one feature, no others.
  # fail-fast: false so a single broken feature does not mask others.
  # ---------------------------------------------------------------------------
  feature-isolation:
    name: feature/${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature:
          # --- Core finance logic (leaf features, no optional deps) ---
          # High-value: most-used domain features and the one that triggered this PR.
          - valuation          # default feature; regression baseline
          - credit             # default feature; credit analysis
          - pe                 # triggered the original bug (pe_tests.rs cross-contamination)
          - ma                 # M&A; distinct domain from pe
          - fixed_income       # bond pricing; large surface area
          - three_statement    # integrated model; tests many accounting identities
          - jurisdiction       # GAAP/IFRS/tax; flag-gated locale logic
          - derivatives        # options/swaps; separate numeric paths
          - quant_risk         # factor models; isolated from market features

          # --- Features with optional crate dependencies (highest compile risk) ---
          - scenarios          # pulls rand + statrs; Monte Carlo foundation
          - monte_carlo        # depends on scenarios; tests the dep chain
          - office             # pulls rust_xlsxwriter + sha2; the bug origin feature
          - audit              # pulls sha2 + uuid; used by multi_agent/federation
          - observability      # pulls tracing + tracing-subscriber + uuid
          - security           # pulls regex; used transitively by federation
          - cost               # pulls rusqlite (bundled) + uuid; DB surface

          # --- Complex composite features (multi-crate dep graphs) ---
          - multi_agent        # petgraph + pathfinding + uuid + audit chain
          - federation         # ed25519-dalek + getrandom + rusqlite + security + managed_agent
          - self_learning      # memory + multi_agent + pathfinding + ed25519-dalek chain
          - managed_agent      # leaf but wires into federation/self_learning chains

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-feature-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-feature-${{ matrix.feature }}-
            ${{ runner.os }}-cargo-feature-

      - name: cargo build --features ${{ matrix.feature }}
        run: cargo build -p corp-finance-core --features ${{ matrix.feature }}

      # --lib scopes execution to the library crate only, excluding
      # crates/corp-finance-core/tests/*.rs integration test files that
      # routinely assume features beyond the one under test.
      - name: cargo test --lib --features ${{ matrix.feature }}
        run: >
          cargo test -p corp-finance-core
          --features ${{ matrix.feature }}
          --lib

  # ---------------------------------------------------------------------------
  # No-default-features build — catches consumers who disable defaults.
  # ---------------------------------------------------------------------------
  no-default-features:
    name: build/no-default-features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-no-defaults-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-no-defaults-

      - name: cargo build --no-default-features
        run: cargo build -p corp-finance-core --no-default-features

  # ---------------------------------------------------------------------------
  # Full-graph sanity check — all features together, workspace-wide.
  # Catches inter-feature conflicts and duplicate symbol errors.
  # ---------------------------------------------------------------------------
  all-features:
    name: build/all-features (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-all-features-

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features
