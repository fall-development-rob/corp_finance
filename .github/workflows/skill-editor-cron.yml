name: skill-editor-cron

on:
  schedule:
    - cron: "0 6 * * 1"    # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      window:
        description: "Time window for outlier detection (e.g., 7d)"
        required: false
        default: "7d"

permissions:
  contents: write
  pull-requests: write

jobs:
  analyse:
    name: analyse-and-propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFA_BANK_BACKEND: s3
      CFA_BANK_S3_BUCKET: ${{ secrets.CFA_BANK_S3_BUCKET }}
      CFA_BANK_S3_ENDPOINT: ${{ secrets.CFA_BANK_S3_ENDPOINT || '' }}
      CFA_BANK_S3_REGION: ${{ secrets.CFA_BANK_S3_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CFA_BANK_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CFA_BANK_AWS_SECRET_ACCESS_KEY }}
      NODE_VERSION: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build harness
        run: npm run -w @robotixai/cfa-harness build
      - name: Analyse + emit remediations
        id: analyse
        run: |
          set -euo pipefail
          npm run -w @robotixai/cfa-harness exec -- \
            cfa-harness skill-editor analyse \
              --window "${{ github.event.inputs.window || '7d' }}" \
              --output docs/proposed-skill-updates/
      - name: Check if any proposals
        id: check
        run: |
          if find docs/proposed-skill-updates -maxdepth 1 -name '*.yaml' | grep -q .; then
            echo "has_proposals=true" >> $GITHUB_OUTPUT
          else
            echo "has_proposals=false" >> $GITHUB_OUTPUT
          fi
      - name: Open PR with proposals
        if: steps.check.outputs.has_proposals == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: skill-editor/auto-proposals-${{ github.run_id }}
          title: "skill-editor: proposed remediations (run ${{ github.run_id }})"
          commit-message: |
            chore(skill-editor): proposed remediations from outlier analysis

            Auto-generated by .github/workflows/skill-editor-cron.yml.
            Review each YAML, then run `cfa-harness skill-editor apply <file>`
            to apply, or close the PR to reject.
          body: |
            Phase 41 closed learning loop produced remediation proposals.

            Each YAML in `docs/proposed-skill-updates/` describes a
            structured change. Apply via:
              `cfa-harness skill-editor apply <file>`

            Or run `cfa-harness skill-editor apply-all docs/proposed-skill-updates/` to apply all.
          add-paths: docs/proposed-skill-updates/
