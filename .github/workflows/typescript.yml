name: TypeScript CI

# TypeScript-specific CI: install, typecheck (tsc --noEmit) and run tests
# (where present) for each MCP server package independently.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  typecheck-and-test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each MCP server package is exercised independently. Test scripts
        # that print "skip — no tests yet" are valid no-ops; only fmp-mcp-server
        # currently has a real vitest suite.
        package:
          - data-mcp-server
          - fmp-mcp-server
          - mcp-server
          - vendor-mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm modules (workspace root)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-root-

      # Phase 32 Wave 1: workspace lockfiles deleted. Install at the repo root
      # so npm workspaces can link internal deps (e.g., @robotixai/mcp-utils
      # is a workspace package not published to the registry — installing
      # per-package would fail to resolve it).
      - name: Install workspace dependencies (root)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      # Build internal workspace deps so consumers' tsc can resolve types.
      # @robotixai/mcp-utils ships dist/index.d.ts — without this, the four
      # MCP servers' typecheck fails on `import { wrapResponse } from "@robotixai/mcp-utils"`.
      - name: Build internal workspace deps
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @robotixai/mcp-utils

      - name: Typecheck (tsc --noEmit)
        shell: bash
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          # Prefer the package-defined script if it exists.
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)" 2>/dev/null; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Run tests (if defined and not a stub)
        shell: bash
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          # Skip when no test script, or when the script is the placeholder
          # "skip — no tests yet" stub. Otherwise run npm test.
          TEST_SCRIPT=$(node -e "console.log(require('./package.json').scripts?.test || '')")
          if [ -z "$TEST_SCRIPT" ]; then
            echo "No test script defined; skipping."
            exit 0
          fi
          if echo "$TEST_SCRIPT" | grep -q "skip — no tests yet"; then
            echo "Test script is the placeholder stub; skipping."
            exit 0
          fi
          npm test
