name: tool-name-lint

# Phase 25 Tier A1 — managed-agent cookbook tool-name drift check.
#
# Two gates, both STRICT:
#   1. Catalog freshness: data/tools-catalog.json must match a fresh
#      regeneration from the 4 in-repo MCP servers. Catches the case where a
#      developer adds/removes a tool but forgets to regenerate the catalog.
#   2. Cookbook lint: every mcp_toolset configs[].name across every cookbook
#      agent.yaml + subagents/*.yaml must resolve to a real catalog entry.
#      Wave 1 shipped this gate as informational because of 107 pre-existing
#      drift instances; Wave 1b cleaned all of them up and flipped to strict.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-tool-names:
    name: lint-tool-names
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache npm modules (workspace root)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-root-

      - name: Install workspace dependencies (root)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      # The lint scripts import from packages/harness/src/manifests/tool-catalog.js.
      # Build the harness so the dist output exists for tsx to resolve.
      - name: Build harness (@robotixai/cfa-harness)
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @robotixai/cfa-harness

      # ---------------------------------------------------------------------
      # Gate 1 (STRICT): the committed catalog must match a fresh regeneration.
      # ---------------------------------------------------------------------
      - name: Verify tools-catalog.json is up to date
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/generate-tool-catalog.ts --check 2>&1 | tee /tmp/catalog-check.log

      # ---------------------------------------------------------------------
      # Gate 2 (STRICT): every configs[].name across every cookbook must
      # resolve to a real catalog entry. Exits 1 on any drift.
      # ---------------------------------------------------------------------
      - name: Lint cookbook tool names (strict)
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/lint-cookbook-tool-names.ts 2>&1 | tee /tmp/cookbook-lint.log

      - name: Upload lint artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-name-lint-logs
          path: |
            /tmp/catalog-check.log
            /tmp/cookbook-lint.log
          if-no-files-found: ignore
          retention-days: 7
