name: Cookbooks CI

# Main user-visible CI gate. Runs on every PR and push to main.
# Stages:
#   1. Build the Rust workspace (all features).
#   2. Run all unit tests (--lib).
#   3. Clippy (-D warnings) and rustfmt --check.
#   4. Validate every managed-agent cookbook (15/15 must pass).
#   5. Smoke-test cookbooks via the cookbook_validate_all MCP tool (15/15 validate + dry-run deploy).
#   6. Build all four TypeScript MCP servers.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  NODE_VERSION: "20"

jobs:
  cookbooks:
    name: Cookbooks gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cookbooks-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cookbooks-

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            packages/data-mcp-server/node_modules
            packages/fmp-mcp-server/node_modules
            packages/mcp-server/node_modules
            packages/vendor-mcp-server/node_modules
          key: ${{ runner.os }}-npm-cookbooks-${{ hashFiles('package-lock.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cookbooks-

      # ---------------------------------------------------------------------
      # Rust workspace: build, test (unit only), clippy, fmt
      # ---------------------------------------------------------------------
      - name: cargo build (workspace, all features)
        run: cargo build --workspace --all-features

      - name: cargo test --lib (workspace, all features)
        run: cargo test --workspace --all-features --lib

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # ---------------------------------------------------------------------
      # Install cfa CLI from extracted repo (Phase 29 Wave 18: corp-finance-cli
      # was extracted to github.com/rob-otix-ai/corp-finance-core; install from
      # the v1.1.0 tag so the cookbook gate has the binary in PATH).
      # ---------------------------------------------------------------------
      - name: Install cfa CLI (from extracted repo at v1.1.0)
        run: cargo install --git https://github.com/rob-otix-ai/corp-finance-core --tag v1.1.0 corp-finance-cli --locked

      # ---------------------------------------------------------------------
      # Managed-agent cookbooks: 15/15 must pass validate + dry-run deploy
      # ---------------------------------------------------------------------
      #
      # NOTE Phase 36: cookbooks migrated JSON → YAML (commit 8e3fd91). The
      # upstream `cfa managed-agent check-all` Rust binary (corp-finance-core
      # v1.1.0) only discovers `.json` cookbook manifests, so it now reports
      # total=0 against our managed-agent-cookbooks tree. The harness-side
      # `cookbook-smoke.test.ts` (78 tests) covers the YAML-aware
      # equivalent — it loads all 15 cookbooks via createCookbookLoader and
      # validates every subagent. That suite runs as part of the TypeScript
      # CI workflow on the same PR.
      #
      # The legacy `cfa managed-agent check-all` step is preserved as
      # informational-only: it prints the binary's output for visibility
      # but the gate is now harness-side. W6.2 (cross-repo) will teach the
      # Rust binary to discover YAML manifests; this step can be a hard
      # gate again at that point.
      - name: managed-agent check-all (informational only, post-YAML)
        shell: bash
        run: |
          set -euo pipefail
          cfa managed-agent check-all > /tmp/check-all.json || true
          cat /tmp/check-all.json
          TOTAL=$(grep -Eo '"total":[[:space:]]*[0-9]+' /tmp/check-all.json | grep -Eo '[0-9]+' | head -1)
          if [ "${TOTAL:-0}" = "0" ]; then
            echo "::notice::cfa managed-agent check-all found 0 .json cookbooks (expected — cookbooks are .yaml since Phase 36; harness-side cookbook-smoke.test.ts is the authoritative gate)"
          elif grep -Eq '"failed":[[:space:]]*[1-9]' /tmp/check-all.json; then
            echo "::error::managed-agent check-all reported failures"
            exit 1
          else
            echo "::notice::managed-agent check-all passed for $TOTAL cookbooks"
          fi

      # Phase 32 Wave 1: workspace lockfiles deleted; install at the repo
      # root so npm workspaces can resolve internal deps (e.g.,
      # @robotixai/mcp-utils is a workspace package not on the registry).
      - name: Install workspace dependencies (root)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      # Build internal workspace deps so dependents resolve dist/*.d.ts.
      - name: Build internal workspace deps
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @robotixai/mcp-utils

      # Phase 40 W6.1 (resolved): cookbook.ts CLI now accepts --skills-root /
      # --agents-root / --cookbooks-root flags. The defaults in cookbookValidateAll
      # have been updated to the canonical plugin-tier paths:
      #   skills: plugins/cfa-core/skills
      #   agents: plugins/cfa-core/agents/cfa
      # We pass them explicitly here so the paths are visible in CI logs and
      # insulated from any future default-change.
      #
      # Note: only a single --skills-root is passed (W6.1 scope). Multi-root
      # coverage across all 3 tiers (core + vertical + partner) requires the
      # upstream `cfa` Rust binary to support multi-value --skills-root. That
      # is deferred to W6.2 (cross-repo update to corp-finance-core).
      - name: cookbook_validate_all MCP tool (15/15 validate + dry-run deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm run -w @robotixai/corp-finance-mcp cookbooks:validate -- \
            --skills-root "$GITHUB_WORKSPACE/plugins/cfa-core/skills" \
            --agents-root "$GITHUB_WORKSPACE/plugins/cfa-core/agents/cfa" \
            --cookbooks-root "$GITHUB_WORKSPACE/managed-agent-cookbooks"

      # ---------------------------------------------------------------------
      # TypeScript MCP servers: build all four (deps already installed at root)
      # ---------------------------------------------------------------------
      - name: Build packages/data-mcp-server
        shell: bash
        working-directory: packages/data-mcp-server
        run: npm run build

      - name: Build packages/fmp-mcp-server
        shell: bash
        working-directory: packages/fmp-mcp-server
        run: npm run build

      - name: Build packages/mcp-server
        shell: bash
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          # mcp-server depends on @robotixai/corp-finance-bindings via file: link
          # Build the bindings package first so the file dep resolves.
          if [ -d ../bindings ]; then
            (cd ../bindings && npm run build)
          fi
          npm run build

      - name: Build packages/vendor-mcp-server
        shell: bash
        working-directory: packages/vendor-mcp-server
        run: npm run build

      - name: Upload check-all output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-agent-check-all
          path: /tmp/check-all.json
          if-no-files-found: ignore
          retention-days: 7
