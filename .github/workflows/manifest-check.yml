name: manifest-check

# Runs the static manifest linter (scripts/check-manifests.ts) on every PR
# and on every push to main (post-merge sanity check).
#
# The linter walks every agent manifest + cookbook in the repo and reports
# drift: missing files, broken cross-refs, and schema-shape issues.
# It exits 1 on errors; in STRICT mode warnings also fail the job.
#
# REC-3 completed (commit 3f84fd6): all 30 cookbook-subagent-no-output-schema
# warnings have been remediated. The runner now runs in --strict mode so any
# new warning must be remediated before it can merge to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-manifests:
    name: lint-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache npm modules (workspace root)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-root-

      # Install all workspace dependencies at the repo root so npm workspaces
      # can resolve internal deps (e.g. @robotixai/mcp-utils is a workspace
      # package not published to the registry; per-package install would fail).
      - name: Install workspace dependencies (root)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      # The linter imports from packages/harness/src/manifests/checker.js.
      # Build the harness first so the dist output exists for tsx to resolve.
      - name: Build harness (@robotixai/cfa-harness)
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @robotixai/cfa-harness

      # STRICT mode — both errors AND warnings fail the build. The REC-1
      # cookbook hardening (commit 3f84fd6) cleared all 30 pre-existing
      # subagent-no-output-schema warnings; from here forward any new
      # warning must be remediated before merge.
      - name: Run manifest linter (strict mode)
        shell: bash
        run: |
          set -euo pipefail
          # pipefail ensures tsx's exit code is preserved through the tee pipeline.
          npx tsx scripts/check-manifests.ts --strict 2>&1 | tee /tmp/manifest-check.log

      # Upload linter stdout as an artefact for easy debugging on failures.
      - name: Upload linter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-check-log
          path: /tmp/manifest-check.log
          if-no-files-found: ignore
          retention-days: 7
