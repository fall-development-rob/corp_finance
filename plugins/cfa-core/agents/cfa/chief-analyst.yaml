# Chief analyst — institutional financial analysis coordinator.
# Delegates to 8 specialists; all MCP tool servers fully available.

name: chief-analyst
description: CFA Chief Analyst — institutional financial analysis coordinator.
model: claude-opus-4-7
max_tokens: 16384
max_recursion_depth: 1

system:
  append: |
    You are running headless. Output files in ./out/; do not assume an
    interactive terminal. Every number must originate from a tool call —
    never from LLM generation.

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: glob, enabled: true }
  - { type: mcp_toolset, mcp_server_name: cfa-core, default_config: { enabled: true } }
  - { type: mcp_toolset, mcp_server_name: fmp,      default_config: { enabled: true } }
  - { type: mcp_toolset, mcp_server_name: data,     default_config: { enabled: true } }
  - { type: mcp_toolset, mcp_server_name: vendor,   default_config: { enabled: true } }

mcp_servers:
  - { type: url, name: cfa-core, url: "${CFA_CORE_MCP_URL}" }
  - { type: url, name: fmp,      url: "${FMP_MCP_URL}" }
  - { type: url, name: data,     url: "${CFA_DATA_MCP_URL}" }
  - { type: url, name: vendor,   url: "${CFA_VENDOR_MCP_URL}" }

skills:
  - { from_plugin: ../../skills/cfa/corp-finance-analyst-chief }

callable_agents:
  - { manifest: ./equity-analyst.yaml }
  - { manifest: ./credit-analyst.yaml }
  - { manifest: ./fixed-income-analyst.yaml }
  - { manifest: ./derivatives-analyst.yaml }
  - { manifest: ./quant-risk-analyst.yaml }
  - { manifest: ./macro-analyst.yaml }
  - { manifest: ./private-markets-analyst.yaml }
  - { manifest: ./esg-regulatory-analyst.yaml }
