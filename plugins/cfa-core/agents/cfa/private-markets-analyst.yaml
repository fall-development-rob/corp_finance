# Private markets analyst — LBO, PE, VC, infrastructure, CLO analytics.

name: private-markets-analyst
description: CFA Private Markets Analyst — LBO, PE, VC, infrastructure, CLO analytics specialist.
model: claude-sonnet-4-6
max_tokens: 8192
max_recursion_depth: 0

system:
  append: |
    You are running headless. Every number must originate from a tool call —
    never from LLM generation.

tools:
  - type: mcp_toolset
    mcp_server_name: cfa-core
    default_config: { enabled: false }
    configs:
      - { name: lbo_model, enabled: true }
      - { name: sources_uses, enabled: true }
      - { name: debt_schedule, enabled: true }
      - { name: waterfall_calculator, enabled: true }
      - { name: returns_calculator, enabled: true }
      - { name: merger_model, enabled: true }
      - { name: venture_fund_model, enabled: true }
      - { name: funding_round, enabled: true }
      - { name: dilution_analysis, enabled: true }
      - { name: j_curve_model, enabled: true }
      - { name: commitment_pacing, enabled: true }
      - { name: manager_selection, enabled: true }
      - { name: secondaries_pricing, enabled: true }
      - { name: fof_portfolio, enabled: true }
      - { name: gp_economics, enabled: true }
      - { name: fund_fee_calculator, enabled: true }
      - { name: investor_net_returns, enabled: true }
      - { name: sotp_valuation, enabled: true }
      - { name: distressed_debt_analysis, enabled: true }
      - { name: recovery_analysis, enabled: true }
      - { name: scenario_analysis, enabled: true }
      - { name: sensitivity_matrix, enabled: true }
      - { name: monte_carlo_simulation, enabled: true }
      - { name: syndication_analysis, enabled: true }
      - { name: direct_loan, enabled: true }
      - { name: unitranche_pricing, enabled: true }
      - { name: credit_metrics, enabled: true }
      - { name: covenant_compliance, enabled: true }
      - { name: debt_capacity, enabled: true }
  - type: mcp_toolset
    mcp_server_name: fmp
    default_config: { enabled: false }
    configs:
      - { name: fmp_quote, enabled: true }
      - { name: fmp_company_profile, enabled: true }
      - { name: fmp_balance_sheet, enabled: true }
      - { name: fmp_income_statement, enabled: true }
      - { name: fmp_cash_flow, enabled: true }
      - { name: fmp_key_metrics, enabled: true }
      - { name: fmp_ratios_ttm, enabled: true }
      - { name: fmp_enterprise_values, enabled: true }
      - { name: fmp_market_cap, enabled: true }
      - { name: fmp_ma_search, enabled: true }
      - { name: fmp_ma_latest, enabled: true }
      - { name: fmp_ipo_calendar, enabled: true }
      - { name: fmp_ipo_disclosure, enabled: true }
      - { name: fmp_executive_compensation, enabled: true }
  - type: mcp_toolset
    mcp_server_name: data
    default_config: { enabled: false }
    configs:
      - { name: edgar_company_facts, enabled: true }
      - { name: edgar_filings, enabled: true }
      - { name: edgar_full_text_search, enabled: true }
      - { name: yf_info, enabled: true }
      - { name: yf_balance_sheet, enabled: true }
  - type: mcp_toolset
    mcp_server_name: vendor
    default_config: { enabled: false }
    configs:
      - { name: pb_company_search, enabled: true }
      - { name: pb_company_profile, enabled: true }
      - { name: pb_deal_search, enabled: true }
      - { name: pb_deal_details, enabled: true }
      - { name: pb_comparable_deals, enabled: true }
      - { name: pb_fundraising, enabled: true }
      - { name: pb_lp_commitments, enabled: true }
      - { name: pb_fund_performance, enabled: true }
      - { name: pb_fund_search, enabled: true }
      - { name: pb_investor_profile, enabled: true }
      - { name: pb_vc_exits, enabled: true }
      - { name: pb_market_stats, enabled: true }
      - { name: factset_ma_deals, enabled: true }
      - { name: sp_ma_deals, enabled: true }
      - { name: sp_capital_structure, enabled: true }
      - { name: sp_funding_digest, enabled: true }

mcp_servers:
  - { type: url, name: cfa-core, url: "${CFA_CORE_MCP_URL}" }
  - { type: url, name: fmp,      url: "${FMP_MCP_URL}" }
  - { type: url, name: data,     url: "${CFA_DATA_MCP_URL}" }
  - { type: url, name: vendor,   url: "${CFA_VENDOR_MCP_URL}" }

skills:
  - { from_plugin: ../../skills/cfa/corp-finance-analyst-private-markets }
