# Quant risk analyst — factor models, portfolio optimization, VaR, stress testing.

name: quant-risk-analyst
description: CFA Quant Risk Analyst — factor models, portfolio optimization, VaR, stress testing specialist.
model: claude-opus-4-7
max_tokens: 8192
max_recursion_depth: 0

system:
  append: |
    You are running headless. Every number must originate from a tool call —
    never from LLM generation.

tools:
  - type: mcp_toolset
    mcp_server_name: cfa-core
    default_config: { enabled: false }
    configs:
      - { name: factor_model, enabled: true }
      - { name: factor_attribution, enabled: true }
      - { name: factor_risk_budget, enabled: true }
      - { name: black_litterman, enabled: true }
      - { name: black_litterman_portfolio, enabled: true }
      - { name: mean_variance_optimization, enabled: true }
      - { name: risk_parity, enabled: true }
      - { name: kelly_sizing, enabled: true }
      - { name: tail_risk_analysis, enabled: true }
      - { name: stress_test, enabled: true }
      - { name: scenario_analysis, enabled: true }
      - { name: sensitivity_matrix, enabled: true }
      - { name: monte_carlo_simulation, enabled: true }
      - { name: brinson_attribution, enabled: true }
      - { name: pairs_trading, enabled: true }
      - { name: momentum_analysis, enabled: true }
      - { name: prospect_theory, enabled: true }
      - { name: market_sentiment, enabled: true }
      - { name: optimal_execution, enabled: true }
      - { name: economic_capital, enabled: true }
      - { name: raroc_calculation, enabled: true }
      - { name: euler_allocation, enabled: true }
      - { name: shapley_allocation, enabled: true }
      - { name: smart_beta, enabled: true }
      - { name: tracking_error, enabled: true }
      - { name: index_weighting, enabled: true }
      - { name: index_rebalancing, enabled: true }
      - { name: index_reconstitution, enabled: true }
      - { name: risk_metrics, enabled: true }
      - { name: risk_adjusted_returns, enabled: true }
      - { name: returns_calculator, enabled: true }
      - { name: portfolio_credit_risk, enabled: true }
      - { name: limit_management, enabled: true }
  - type: mcp_toolset
    mcp_server_name: fmp
    default_config: { enabled: false }
    configs:
      - { name: fmp_quote, enabled: true }
      - { name: fmp_batch_quote, enabled: true }
      - { name: fmp_historical_price, enabled: true }
      - { name: fmp_index_constituents, enabled: true }
      - { name: fmp_sector_performance, enabled: true }
      - { name: fmp_market_risk_premium, enabled: true }
  - type: mcp_toolset
    mcp_server_name: data
    default_config: { enabled: false }
    configs:
      - { name: fred_series, enabled: true }
      - { name: fred_yield_curve, enabled: true }
      - { name: yf_historical, enabled: true }
      - { name: yf_batch_quotes, enabled: true }
  - type: mcp_toolset
    mcp_server_name: vendor
    default_config: { enabled: false }
    configs:
      - { name: factset_factor_exposure, enabled: true }
      - { name: factset_risk_model, enabled: true }
      - { name: factset_portfolio_analytics, enabled: true }
      - { name: ms_portfolio_xray, enabled: true }

mcp_servers:
  - { type: url, name: cfa-core, url: "${CFA_CORE_MCP_URL}" }
  - { type: url, name: fmp,      url: "${FMP_MCP_URL}" }
  - { type: url, name: data,     url: "${CFA_DATA_MCP_URL}" }
  - { type: url, name: vendor,   url: "${CFA_VENDOR_MCP_URL}" }

skills:
  - { from_plugin: ../../skills/cfa/corp-finance-analyst-quant-risk }
