# corp-finance-{core,wasm,cli} extracted to /home/robert/corp-finance-core (Phase 29 Wave 18).
# cfa_agent is the agent integration layer; corp-finance-core is the compute library.
# packages/bindings depends on corp-finance-core via an absolute path dep pointing to the
# extracted repo. To use a published crate or git ref instead, update packages/bindings/Cargo.toml.
[workspace]
resolver = "2"
members = [
    "packages/bindings",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Robert Fall <hello@rob-otix.com>"]
license = "MIT"

# WASM release profile (used by `cargo build --release --target wasm32-unknown-unknown`
# and by `wasm-pack build --release` for the corp-finance-wasm crate).
# Wave 17a — bundle size optimization: panic=abort drops unwinding code,
# strip removes debug symbols, codegen-units=1 + lto=fat maximises
# cross-crate inlining and dead-code elimination.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
